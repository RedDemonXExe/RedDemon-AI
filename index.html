<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat Interface</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#ffffff',
                            darkBg: '#131314',
                            sidebar: '#f0f4f9',
                            darkSidebar: '#1e1f20',
                            userBubble: '#f0f4f9',
                            darkUserBubble: '#333537',
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
        
        /* Auto-resizing textarea reset */
        textarea { resize: none; }
        
        /* Prose overrides for better AI formatting */
        .prose pre { background-color: #1f2937 !important; border-radius: 0.5rem; padding: 1rem; overflow-x: auto; }
        .prose code { color: #ec4899; background: rgba(156, 163, 175, 0.2); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-weight: normal; }
        .prose pre code { color: #e5e7eb; background: transparent; padding: 0; }
        
        /* Stop tap highlight on mobile */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gemini-bg dark:bg-gemini-darkBg text-gray-800 dark:text-gray-200 antialiased overflow-hidden m-0 p-0 selection:bg-blue-200 dark:selection:bg-blue-900">

    <div id="loading" class="fixed inset-0 flex items-center justify-center bg-white dark:bg-gemini-darkBg z-[100] transition-opacity duration-300">
        <div class="flex flex-col items-center space-y-4">
            <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <div class="text-lg font-medium text-gray-600 dark:text-gray-300">Loading App...</div>
        </div>
    </div>

    <div id="app" class="fixed inset-0 flex opacity-0 transition-opacity duration-500 z-0">
        
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="absolute lg:relative z-30 w-72 h-full bg-gemini-sidebar dark:bg-gemini-darkSidebar flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 border-r border-gray-200 dark:border-gray-800">
            
            <div class="p-4 flex items-center justify-between">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <button onclick="createNewChat()" class="flex items-center space-x-2 bg-white dark:bg-[#1a1a1c] border border-gray-200 dark:border-gray-700 rounded-full px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors w-full lg:w-auto shadow-sm">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="font-medium text-sm">New chat</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
                </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-2">
                <button onclick="toggleDarkMode()" class="w-full flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-sm font-medium">
                    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span>Toggle Theme</span>
                </button>
                <button onclick="openSettings()" class="w-full flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-sm font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full min-w-0 bg-gemini-bg dark:bg-gemini-darkBg relative">
            
            <header class="lg:hidden flex items-center justify-between p-4 bg-gemini-bg dark:bg-gemini-darkBg border-b border-gray-100 dark:border-gray-800 z-10 sticky top-0">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <span class="font-semibold text-lg" id="mobile-header-title">Universal AI</span>
                </div>
                <button onclick="createNewChat()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-blue-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </header>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 w-full max-w-4xl mx-auto space-y-6 pb-32">
                </div>

            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-gemini-bg via-gemini-bg to-transparent dark:from-gemini-darkBg dark:via-gemini-darkBg pt-6 pb-4 px-4 sm:px-6">
                <div class="max-w-4xl mx-auto">
                    <form id="chat-form" class="relative flex items-end bg-gemini-sidebar dark:bg-gemini-darkSidebar rounded-3xl border border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm focus-within:ring-1 focus-within:ring-gray-300 dark:focus-within:ring-gray-600 transition-shadow">
                        <textarea 
                            id="message-input" 
                            rows="1" 
                            class="w-full max-h-48 py-4 pl-6 pr-14 bg-transparent border-none focus:ring-0 resize-none text-base outline-none dark:placeholder-gray-400 placeholder-gray-500" 
                            placeholder="Ask me anything..."
                            oninput="autoResize(this)"
                            onkeydown="handleKeydown(event)"
                        ></textarea>
                        <button type="submit" id="send-btn" class="absolute right-3 bottom-3 p-2 rounded-full text-gray-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors disabled:opacity-50">
                            <svg class="w-6 h-6 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                        </button>
                    </form>
                    <div class="text-center mt-2 text-xs text-gray-500 dark:text-gray-400">
                        AI can make mistakes. Verify important information.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gemini-darkSidebar rounded-2xl w-full max-w-md p-6 shadow-xl transform transition-all">
            <h2 class="text-xl font-semibold mb-4">Settings</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="setting-api-key" class="w-full px-3 py-2 border rounded-lg dark:bg-[#1a1a1c] dark:border-gray-700 outline-none focus:border-blue-500" placeholder="sk-or-v1-...">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-1">Model ID</label>
                    <input type="text" id="setting-model" class="w-full px-3 py-2 border rounded-lg dark:bg-[#1a1a1c] dark:border-gray-700 outline-none focus:border-blue-500" placeholder="deepseek/deepseek-r1:free">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt</label>
                    <textarea id="setting-system" rows="3" class="w-full px-3 py-2 border rounded-lg dark:bg-[#1a1a1c] dark:border-gray-700 outline-none focus:border-blue-500" placeholder="You are a helpful assistant..."></textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeSettings()" class="px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-sm font-medium">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors text-sm font-medium">Save Settings</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const DEFAULT_SETTINGS = {
            apiKey: '',
            model: 'deepseek/deepseek-r1:free',
            systemPrompt: 'You are a highly capable, concise, and helpful AI assistant.',
            darkMode: window.matchMedia('(prefers-color-scheme: dark)').matches
        };

        let settings = JSON.parse(localStorage.getItem('gemini_clone_settings')) || DEFAULT_SETTINGS;
        let chats = JSON.parse(localStorage.getItem('gemini_clone_chats')) || [];
        let currentChatId = localStorage.getItem('gemini_clone_current_chat') || null;
        let isGenerating = false;
        let abortController = null;

        // Ensure at least one chat exists
        if (chats.length === 0) {
            createNewChat(false);
        } else if (!chats.find(c => c.id === currentChatId)) {
            currentChatId = chats[0].id;
        }

        // --- DOM Elements ---
        const els = {
            loading: document.getElementById('loading'),
            app: document.getElementById('app'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay'),
            chatList: document.getElementById('chat-list'),
            messagesContainer: document.getElementById('messages-container'),
            chatForm: document.getElementById('chat-form'),
            messageInput: document.getElementById('message-input'),
            sendBtn: document.getElementById('send-btn'),
            settingsModal: document.getElementById('settings-modal'),
            mobileHeaderTitle: document.getElementById('mobile-header-title')
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            renderSidebar();
            loadChat(currentChatId);
            
            // Remove loader safely
            setTimeout(() => {
                els.loading.style.opacity = '0';
                els.app.classList.remove('hidden');
                setTimeout(() => {
                    els.loading.style.display = 'none';
                    els.app.style.opacity = '1';
                }, 300);
            }, 100);
        });

        // --- Persistence ---
        function saveState() {
            localStorage.setItem('gemini_clone_chats', JSON.stringify(chats));
            localStorage.setItem('gemini_clone_current_chat', currentChatId);
            localStorage.setItem('gemini_clone_settings', JSON.stringify(settings));
        }

        // --- UI Interactions ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function toggleDarkMode() {
            settings.darkMode = !settings.darkMode;
            saveState();
            applyTheme();
        }

        function applyTheme() {
            if (settings.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                els.chatForm.dispatchEvent(new Event('submit'));
            }
        }

        function scrollToBottom() {
            els.messagesContainer.scrollTo({
                top: els.messagesContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // --- Settings Modal ---
        function openSettings() {
            document.getElementById('setting-api-key').value = settings.apiKey;
            document.getElementById('setting-model').value = settings.model;
            document.getElementById('setting-system').value = settings.systemPrompt;
            els.settingsModal.classList.remove('hidden');
        }

        function closeSettings() {
            els.settingsModal.classList.add('hidden');
        }

        function saveSettings() {
            const key = document.getElementById('setting-api-key').value.trim();
            if (!key) return alert('API Key is required!');
            
            settings.apiKey = key;
            settings.model = document.getElementById('setting-model').value.trim() || 'deepseek/deepseek-r1:free';
            settings.systemPrompt = document.getElementById('setting-system').value.trim();
            saveState();
            closeSettings();
        }

        // --- Chat Management ---
        function createNewChat(render = true) {
            const newId = Date.now().toString();
            chats.unshift({
                id: newId,
                title: 'New Chat',
                messages: []
            });
            currentChatId = newId;
            saveState();
            
            if (render) {
                renderSidebar();
                loadChat(newId);
                if(window.innerWidth < 1024) toggleSidebar(); // close sidebar on mobile
            }
        }

        function loadChat(id) {
            currentChatId = id;
            saveState();
            renderSidebar();
            
            const chat = chats.find(c => c.id === id);
            els.mobileHeaderTitle.textContent = chat ? chat.title : 'Universal AI';
            els.messagesContainer.innerHTML = '';
            
            if (chat && chat.messages.length === 0) {
                els.messagesContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center space-y-4 opacity-50">
                        <div class="w-16 h-16 bg-gradient-to-tr from-blue-500 to-purple-500 rounded-full flex items-center justify-center shadow-lg">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <h2 class="text-2xl font-semibold">How can I help you today?</h2>
                    </div>
                `;
                return;
            }

            chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
            scrollToBottom();
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if(!confirm('Delete this chat?')) return;
            
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) createNewChat(false);
            if (currentChatId === id) currentChatId = chats[0].id;
            
            saveState();
            renderSidebar();
            loadChat(currentChatId);
        }

        function renameChat(id, e) {
            e.stopPropagation();
            const chat = chats.find(c => c.id === id);
            const newTitle = prompt('Rename chat:', chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();
                saveState();
                renderSidebar();
                if(currentChatId === id) els.mobileHeaderTitle.textContent = chat.title;
            }
        }

        function renderSidebar() {
            els.chatList.innerHTML = chats.map(chat => `
                <div onclick="loadChat('${chat.id}')" class="group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-colors ${chat.id === currentChatId ? 'bg-white dark:bg-[#282a2c] shadow-sm' : 'hover:bg-gray-200 dark:hover:bg-[#282a2c]'}">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span class="truncate text-sm font-medium ${chat.id === currentChatId ? 'text-blue-600 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'}">${chat.title}</span>
                    </div>
                    <div class="hidden group-hover:flex items-center space-x-1 flex-shrink-0">
                        <button onclick="renameChat('${chat.id}', event)" class="p-1 rounded hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="deleteChat('${chat.id}', event)" class="p-1 rounded hover:bg-red-200 dark:hover:bg-red-900/30 text-gray-500 hover:text-red-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                </div>
            `).join('');
        }

        // --- Messaging Logic ---
        function appendMessageUI(role, content) {
            // Remove placeholder if present
            if (els.messagesContainer.querySelector('h2')?.textContent === 'How can I help you today?') {
                els.messagesContainer.innerHTML = '';
            }

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col w-full ${role === 'user' ? 'items-end' : 'items-start'}`;

            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="px-5 py-3 rounded-3xl rounded-br-sm bg-gemini-userBubble dark:bg-gemini-darkUserBubble text-gray-900 dark:text-gray-100 max-w-[85%] break-words">
                        ${content.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>")}
                    </div>
                `;
            } else {
                // AI Message wrapper
                wrapper.innerHTML = `
                    <div class="flex space-x-4 max-w-full w-full group">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex-shrink-0 flex items-center justify-center mt-1 shadow-sm">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0 prose prose-sm md:prose-base dark:prose-invert max-w-none ai-content overflow-x-auto break-words leading-relaxed">
                            ${marked.parse(content)}
                        </div>
                    </div>
                `;
            }
            
            els.messagesContainer.appendChild(wrapper);
            return wrapper;
        }

        els.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isGenerating) return;

            if (!settings.apiKey) {
                openSettings();
                return;
            }

            const content = els.messageInput.value.trim();
            if (!content) return;

            // Reset input
            els.messageInput.value = '';
            els.messageInput.style.height = 'auto';
            
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            // Auto-generate title if first message
            if (chat.messages.length === 0) {
                chat.title = content.length > 25 ? content.substring(0, 25) + '...' : content;
                renderSidebar();
                els.mobileHeaderTitle.textContent = chat.title;
            }

            // Save user message
            chat.messages.push({ role: 'user', content });
            saveState();
            appendMessageUI('user', content);
            scrollToBottom();

            // Prepare API payload
            const payloadMessages = [
                { role: 'system', content: settings.systemPrompt },
                ...chat.messages
            ];

            isGenerating = true;
            els.sendBtn.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            
            // Create empty AI message UI for streaming
            const aiMessageWrapper = appendMessageUI('assistant', '');
            const aiContentContainer = aiMessageWrapper.querySelector('.ai-content');
            let aiFullText = "";

            try {
                abortController = new AbortController();
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${settings.apiKey}`
                    },
                    body: JSON.stringify({
                        model: settings.model,
                        messages: payloadMessages,
                        stream: true
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    const errData = await response.json().catch(()=>({}));
                    throw new Error(errData.error?.message || `API Error: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let done = false;
                let buffer = "";

                while (!done) {
                    const { value, done: doneReading } = await reader.read();
                    done = doneReading;
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        // Keep the last incomplete line in the buffer
                        buffer = lines.pop(); 

                        for (const line of lines) {
                            if (line.trim().startsWith('data: ')) {
                                const dataStr = line.replace(/^data:\s*/, '').trim();
                                if (dataStr === '[DONE]') continue;
                                
                                try {
                                    const parsed = JSON.parse(dataStr);
                                    const chunkContent = parsed.choices?.[0]?.delta?.content || "";
                                    if (chunkContent) {
                                        aiFullText += chunkContent;
                                        // Use marked to parse markdown continuously
                                        aiContentContainer.innerHTML = marked.parse(aiFullText);
                                        scrollToBottom();
                                    }
                                } catch (err) {
                                    // Silent catch for partial JSON chunks that might slip through
                                }
                            }
                        }
                    }
                }

                // Push final message to history
                chat.messages.push({ role: 'assistant', content: aiFullText });
                saveState();

            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error(error);
                    const errorMsg = `**Error:** ${error.message}`;
                    aiContentContainer.innerHTML = marked.parse(errorMsg);
                    chat.messages.push({ role: 'assistant', content: errorMsg });
                    saveState();
                }
            } finally {
                isGenerating = false;
                abortController = null;
                els.sendBtn.innerHTML = `<svg class="w-6 h-6 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>`;
            }
        });
    </script>
</body>
</html>
