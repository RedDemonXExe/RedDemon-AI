<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RedDemonAI | Infernal Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        :root { --bg-deep: #0a0505; --sidebar-bg: #0f0707; --card-bg: #150a0a; --demon-red: #dc2626; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-deep); color: #d1d5db; overflow-x: hidden; }
        .prose pre { background: #000; padding: 1rem; border-radius: 0.5rem; border: 1px solid rgba(220, 38, 38, 0.2); overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin: 1rem 0; }
        .prose code { color: #f87171; font-family: 'JetBrains Mono', monospace; }
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0505; z-index: 9999; transition: opacity 0.5s ease; }
        .pentagram-spinner { width: 50px; height: 50px; border: 3px solid #dc2626; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #dc262633; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Loading Screen -->
    <div id="loading">
        <div class="pentagram-spinner mb-4"></div>
        <div class="text-red-600 font-bold tracking-widest uppercase text-[10px] animate-pulse">Summoning Core...</div>
    </div>

    <div id="app" class="hidden flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-72 bg-[#0f0707] border-r border-red-900/30 flex flex-col z-50 -translate-x-full lg:translate-x-0">
            <div class="p-6 h-full flex flex-col">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-red-600 rounded-lg shadow-[0_0_15px_rgba(220,38,38,0.5)] flex items-center justify-center">
                            <i data-lucide="flame" class="w-5 h-5 text-white"></i>
                        </div>
                        <h1 class="text-xl font-bold tracking-tight text-white">Red<span class="text-red-600">Demon</span>AI</h1>
                    </div>
                </div>
                <button onclick="createNewChat()" class="w-full py-3 px-4 rounded-xl border border-red-900/50 bg-red-950/20 text-red-400 hover:bg-red-900/30 transition-all flex items-center gap-3 mb-6 font-semibold">
                    <i data-lucide="plus" class="w-5 h-5"></i> New Ritual
                </button>
                <nav id="chat-history" class="flex-1 overflow-y-auto space-y-2 pr-2 custom-scroll">
                    <div class="text-[10px] uppercase tracking-widest text-red-500/50 font-bold mb-3 px-3">Recent Echoes</div>
                </nav>
                <div class="mt-auto pt-6 space-y-4 border-t border-red-900/20">
                    <div class="bg-red-950/40 p-4 rounded-xl border border-red-600/30">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-red-400 font-semibold uppercase tracking-tighter text-[10px]">Daily Essence</span>
                            <span id="credits-text" class="text-xs text-white">10/10</span>
                        </div>
                        <div class="w-full bg-red-900/10 h-1.5 rounded-full overflow-hidden">
                            <div id="credits-bar" class="bg-red-600 h-full w-full shadow-[0_0_8px_rgba(220,38,38,0.8)] transition-all duration-700"></div>
                        </div>
                    </div>
                    <button onclick="openAdminModal()" class="w-full text-[10px] text-red-500/70 hover:text-red-400 text-center font-bold transition-colors uppercase tracking-widest">Admin Portal (2050)</button>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col relative w-full lg:ml-72 bg-[#0a0505]">
            <header class="h-16 border-b border-red-900/10 flex items-center justify-between px-4 lg:px-8 bg-[#0a0505]/80 backdrop-blur-md sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="lg:hidden text-red-600"><i data-lucide="menu"></i></button>
                    <div class="px-3 py-1 rounded-full border border-red-600/50 bg-red-600/10 flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                        <span id="current-model-display" class="text-[10px] font-bold text-red-400 uppercase tracking-widest">RedDemonDevil</span>
                    </div>
                    <select id="model-selector" onchange="updateModel()" class="bg-transparent text-[10px] text-gray-500 border-none focus:ring-0 cursor-pointer hover:text-white uppercase font-bold tracking-tighter">
                        <option value="RedDemonDevil">Devil</option>
                        <option value="RedDemonDivineAngel">Divine Angel</option>
                        <option value="ArtificialDemon">Artifact</option>
                    </select>
                </div>
            </header>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 lg:p-8 space-y-6 flex flex-col custom-scroll">
                <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center opacity-30">
                    <div class="w-16 h-16 bg-red-900/20 rounded-full flex items-center justify-center mb-4"><i data-lucide="ghost" class="w-8 h-8 text-red-600"></i></div>
                    <h2 class="text-xl font-bold text-white mb-2">The Void is Listening</h2>
                </div>
            </div>

            <div class="p-4 lg:p-8 bg-gradient-to-t from-[#0a0505] via-[#0a0505] to-transparent sticky bottom-0">
                <form id="chat-form" onsubmit="handleChatSubmit(event)" class="relative max-w-3xl mx-auto flex items-center bg-[#150a0a] border border-red-600/40 rounded-2xl p-2 shadow-2xl">
                    <input id="user-input" type="text" placeholder="Cast your query..." class="flex-1 bg-transparent border-none focus:ring-0 text-sm text-gray-200 px-4 outline-none" autocomplete="off">
                    <button type="submit" id="send-btn" class="bg-red-600 hover:bg-red-500 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-[0_0_15px_rgba(220,38,38,0.3)]">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Admin Modal -->
    <div id="modal-container" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative w-full max-w-xs bg-[#150a0a] border border-red-600/30 rounded-2xl p-6 shadow-2xl text-center">
            <h2 class="text-lg font-bold text-white mb-4 uppercase">Authorize</h2>
            <input type="email" id="admin-user" placeholder="admin@2050" class="w-full bg-[#0a0505] border border-red-900/30 rounded-xl p-3 text-xs mb-3 outline-none">
            <input type="password" id="admin-pass" placeholder="Password" class="w-full bg-[#0a0505] border border-red-900/30 rounded-xl p-3 text-xs mb-4 outline-none">
            <button onclick="verifyAdmin()" class="w-full py-3 bg-red-600 text-white rounded-xl font-bold text-xs">SUMMON ACCESS</button>
        </div>
    </div>

    <script>
        const MODELS = { 'RedDemonDevil': 'openrouter/free', 'RedDemonDivineAngel': 'google/gemma-4-26b-a4b-it:free', 'ArtificialDemon': 'openai/gpt-oss-20b:free' };
        let state = { chats: [], currentChatId: null, isAdmin: false, credits: 10, model: 'RedDemonDevil', systemPrompt: 'Tone: Dark, witty, sophisticated daemon advisor.' };

        function init() {
            const saved = localStorage.getItem('red_demon_v1');
            if (saved) state = { ...state, ...JSON.parse(saved) };
            renderChatHistory();
            if (!state.currentChatId) createNewChat();
            renderMessages();
            updateCreditDisplay();
            lucide.createIcons();
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => { document.getElementById('loading').remove(); document.getElementById('app').classList.remove('hidden'); }, 500);
        }

        function createNewChat() {
            const id = Date.now().toString();
            state.chats.unshift({ id, title: 'New Ritual', messages: [] });
            state.currentChatId = id;
            save(); renderChatHistory(); renderMessages();
        }

        function renderChatHistory() {
            const nav = document.getElementById('chat-history');
            nav.querySelectorAll('.h-item').forEach(e => e.remove());
            state.chats.forEach(c => {
                const el = document.createElement('div');
                el.className = `h-item p-3 rounded-lg cursor-pointer text-xs transition-all ${c.id === state.currentChatId ? 'bg-red-600/10 border-l-2 border-red-600 text-red-400' : 'text-gray-500 hover:text-gray-200'}`;
                el.innerText = c.title;
                el.onclick = () => { state.currentChatId = c.id; save(); renderChatHistory(); renderMessages(); };
                nav.appendChild(el);
            });
        }

        function updateCreditDisplay() {
            document.getElementById('credits-text').innerText = state.isAdmin ? '∞/∞' : `${state.credits}/10`;
            document.getElementById('credits-bar').style.width = state.isAdmin ? '100%' : `${state.credits * 10}%`;
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if (!val || (!state.isAdmin && state.credits <= 0)) return;
            
            input.value = '';
            const chat = state.chats.find(c => c.id === state.currentChatId);
            chat.messages.push({ role: 'user', content: val });
            if (chat.title === 'New Ritual') chat.title = val.slice(0, 20);
            
            if (!state.isAdmin) state.credits--;
            updateCreditDisplay();
            renderMessages();
            save();

            const aiMsg = { role: 'assistant', content: '...' };
            chat.messages.push(aiMsg);
            const container = document.getElementById('messages-container');
            const el = createMsgEl('assistant', '...');
            container.appendChild(el);
            const contentBox = el.querySelector('.prose');

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer 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", "Content-Type": "application/json" },
                    body: JSON.stringify({ model: MODELS[state.model], messages: chat.messages.slice(0,-1), stream: true })
                });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let txt = "";
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
                    for (const l of lines) {
                        const m = l.replace('data: ', '');
                        if (m === '[DONE]') break;
                        try { txt += JSON.parse(m).choices[0].delta.content || ""; contentBox.innerHTML = marked.parse(txt); aiMsg.content = txt; container.scrollTop = container.scrollHeight; } catch(e){}
                    }
                }
                save();
            } catch(e) { contentBox.innerText = "[ERROR: VOID SIGNAL WEAK]"; }
        }

        function createMsgEl(role, content) {
            const d = document.createElement('div');
            d.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start gap-4'} message-in`;
            d.innerHTML = role === 'user' ? `<div class="max-w-[80%] bg-red-600 text-white px-4 py-2 rounded-2xl text-sm shadow-xl">${content}</div>` : 
                `<div class="w-8 h-8 rounded-full bg-red-950 border border-red-600 flex items-center justify-center text-[10px]">😈</div><div class="max-w-[85%] bg-[#150a0a] border border-red-900/20 p-4 rounded-2xl prose prose-invert text-sm">${marked.parse(content)}</div>`;
            return d;
        }

        function renderMessages() {
            const c = document.getElementById('messages-container');
            c.querySelectorAll('.message-in').forEach(e => e.remove());
            const chat = state.chats.find(ch => ch.id === state.currentChatId);
            if (chat && chat.messages.length) {
                document.getElementById('empty-state').classList.add('hidden');
                chat.messages.forEach(m => c.appendChild(createMsgEl(m.role, m.content)));
            } else { document.getElementById('empty-state').classList.remove('hidden'); }
            c.scrollTop = c.scrollHeight;
        }

        function verifyAdmin() {
            if (document.getElementById('admin-user').value === 'admin@2050' && document.getElementById('admin-pass').value === 'AdminAIDemon2055') {
                state.isAdmin = true; save(); updateCreditDisplay(); closeModal();
            } else alert("REJECTED");
        }

        function openAdminModal() { document.getElementById('modal-container').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function save() { localStorage.setItem('red_demon_v1', JSON.stringify(state)); }
        function toggleSidebar() { const s = document.getElementById('sidebar'); s.classList.toggle('-translate-x-full'); }
        window.onload = init;
    </script>
</body>
</html>
