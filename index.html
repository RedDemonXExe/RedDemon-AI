<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RedDemonAI</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#ffffff',
                            darkBg: '#131314',
                            sidebar: '#f0f4f9',
                            darkSidebar: '#1e1f20',
                            userBubble: '#f0f4f9',
                            darkUserBubble: '#333537',
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
        textarea { resize: none; }
        .prose pre { background-color: #1f2937 !important; border-radius: 0.5rem; padding: 1rem; overflow-x: auto; }
        .prose code { color: #ef4444; background: rgba(156, 163, 175, 0.15); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-weight: normal; }
        .prose pre code { color: #e5e7eb; background: transparent; padding: 0; }
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gemini-bg dark:bg-gemini-darkBg text-gray-800 dark:text-gray-200 antialiased m-0 p-0 overflow-hidden selection:bg-red-200 dark:selection:bg-red-900">

    <div id="loading" class="fixed inset-0 flex items-center justify-center bg-white dark:bg-gemini-darkBg z-[100] transition-opacity duration-300">
        <div class="flex flex-col items-center space-y-4">
            <svg class="animate-spin h-8 w-8 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <div class="text-lg font-medium text-gray-600 dark:text-gray-300">Summoning RedDemonAI...</div>
        </div>
    </div>

    <div id="app" class="flex h-[100dvh] w-full opacity-0 transition-opacity duration-500 relative z-0">
        
        <div id="sidebar-overlay" class="absolute inset-0 bg-black/50 z-20 hidden lg:hidden" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="absolute lg:relative z-30 w-72 h-full bg-gemini-sidebar dark:bg-gemini-darkSidebar flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 border-r border-gray-200 dark:border-gray-800 flex-shrink-0 shadow-2xl lg:shadow-none">
            <div class="p-4 flex items-center justify-between">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <button onclick="createNewChat()" class="flex items-center space-x-2 bg-white dark:bg-[#1a1a1c] border border-gray-200 dark:border-gray-700 rounded-full px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors w-full lg:w-auto shadow-sm">
                    <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="font-medium text-sm">New chat</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
                </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-2 flex-shrink-0">
                <button onclick="toggleDarkMode()" class="w-full flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-sm font-medium">
                    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span>Toggle Theme</span>
                </button>
                </div>
        </aside>

        <main class="flex-1 flex flex-col h-full min-w-0 bg-gemini-bg dark:bg-gemini-darkBg">
            
            <header class="lg:hidden flex-shrink-0 flex items-center justify-between p-4 bg-gemini-bg dark:bg-gemini-darkBg border-b border-gray-100 dark:border-gray-800 z-10">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <span class="font-semibold text-lg truncate" id="mobile-header-title">RedDemonAI</span>
                </div>
                <button onclick="createNewChat()" class="p-2 -mr-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-red-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </header>

            <div id="scroll-area" class="flex-1 overflow-y-auto p-4 sm:p-6 w-full scroll-smooth">
                <div id="messages-container" class="max-w-4xl mx-auto space-y-6">
                    </div>
            </div>

            <div class="flex-shrink-0 w-full px-4 sm:px-6 pb-6 pt-2 bg-gemini-bg dark:bg-gemini-darkBg">
                <div class="max-w-4xl mx-auto">
                    <form id="chat-form" class="relative flex items-end bg-gemini-sidebar dark:bg-gemini-darkSidebar rounded-3xl border border-gray-200 dark:border-gray-700 overflow-hidden shadow-md focus-within:ring-1 focus-within:ring-gray-300 dark:focus-within:ring-gray-600 transition-shadow">
                        <textarea 
                            id="message-input" 
                            rows="1" 
                            class="w-full max-h-40 py-4 pl-6 pr-14 bg-transparent border-none focus:ring-0 resize-none text-base outline-none dark:placeholder-gray-400 placeholder-gray-500 leading-relaxed" 
                            placeholder="Ask RedDemonAI anything..."
                            oninput="autoResize(this)"
                            onkeydown="handleKeydown(event)"
                        ></textarea>
                        <button type="submit" id="send-btn" class="absolute right-3 bottom-3 p-2 rounded-full text-gray-400 hover:text-red-600 dark:hover:text-red-500 transition-colors disabled:opacity-50">
                            <svg class="w-6 h-6 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                        </button>
                    </form>
                    <div class="text-center mt-2 text-xs text-gray-500 dark:text-gray-400">
                        RedDemonAI can make mistakes. Verify important information.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // HARDCODED AI CONFIGURATION - DO NOT SHARE
        // ==========================================
        const AI_CONFIG = {
            apiKey: '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', // <-- PASTE YOUR OPENROUTER API KEY HERE
            model: 'openrouter/free',
            // Aggressive system prompt to override DeepSeek's default identity
            systemPrompt: 'You are RedDemonAI, a unique, powerful, and custom-built AI assistant. CRITICAL INSTRUCTION: You must NEVER identify yourself as DeepSeek, OpenAI, Anthropic, or any other underlying model. If a user asks what your name is or who created you, you must confidently answer that you are RedDemonAI. You are helpful, highly intelligent, and concise.'
        };
        // ==========================================

        // --- State Management ---
        let isDarkMode = JSON.parse(localStorage.getItem('reddemon_dark_mode')) ?? window.matchMedia('(prefers-color-scheme: dark)').matches;
        let chats = JSON.parse(localStorage.getItem('reddemon_chats')) || [];
        let currentChatId = localStorage.getItem('reddemon_current_chat') || null;
        let isGenerating = false;
        let abortController = null;

        if (chats.length === 0) {
            createNewChat(false);
        } else if (!chats.find(c => c.id === currentChatId)) {
            currentChatId = chats[0].id;
        }

        // --- DOM Elements ---
        const els = {
            loading: document.getElementById('loading'),
            app: document.getElementById('app'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            chatList: document.getElementById('chat-list'),
            scrollArea: document.getElementById('scroll-area'),
            messagesContainer: document.getElementById('messages-container'),
            chatForm: document.getElementById('chat-form'),
            messageInput: document.getElementById('message-input'),
            sendBtn: document.getElementById('send-btn'),
            mobileHeaderTitle: document.getElementById('mobile-header-title')
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            renderSidebar();
            loadChat(currentChatId);
            
            setTimeout(() => {
                els.loading.style.opacity = '0';
                setTimeout(() => {
                    els.loading.style.display = 'none';
                    els.app.style.opacity = '1';
                }, 300);
            }, 100);
        });

        // --- Persistence ---
        function saveState() {
            localStorage.setItem('reddemon_chats', JSON.stringify(chats));
            localStorage.setItem('reddemon_current_chat', currentChatId);
            localStorage.setItem('reddemon_dark_mode', JSON.stringify(isDarkMode));
        }

        // --- UI Interactions ---
        function toggleSidebar() {
            els.sidebar.classList.toggle('-translate-x-full');
            els.sidebarOverlay.classList.toggle('hidden');
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            saveState();
            applyTheme();
        }

        function applyTheme() {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                els.chatForm.dispatchEvent(new Event('submit'));
            }
        }

        function scrollToBottom() {
            els.scrollArea.scrollTo({
                top: els.scrollArea.scrollHeight,
                behavior: 'smooth'
            });
        }

        // --- Chat Management ---
        function createNewChat(render = true) {
            const newId = Date.now().toString();
            chats.unshift({
                id: newId,
                title: 'New Chat',
                messages: []
            });
            currentChatId = newId;
            saveState();
            
            if (render) {
                renderSidebar();
                loadChat(newId);
                if(window.innerWidth < 1024 && !els.sidebarOverlay.classList.contains('hidden')) toggleSidebar();
            }
        }

        function loadChat(id) {
            currentChatId = id;
            saveState();
            renderSidebar();
            
            const chat = chats.find(c => c.id === id);
            els.mobileHeaderTitle.textContent = chat ? chat.title : 'RedDemonAI';
            els.messagesContainer.innerHTML = '';
            
            if (chat && chat.messages.length === 0) {
                els.messagesContainer.innerHTML = `
                    <div id="welcome-message" class="flex flex-col items-center justify-center pt-20 text-center space-y-4 opacity-50">
                        <div class="w-16 h-16 bg-gradient-to-tr from-red-600 to-red-900 rounded-full flex items-center justify-center shadow-lg">
                            <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12.0003 1.99997C12.0003 1.99997 12.4497 9.0754 19.5251 9.52485C12.4497 9.9743 12.0003 17.0498 12.0003 17.0498C12.0003 17.0498 11.5508 9.9743 4.4754 9.52485C11.5508 9.0754 12.0003 1.99997 12.0003 1.99997Z"/>
                                <path d="M19.0002 14.9999C19.0002 14.9999 19.2249 18.5376 22.7626 18.7623C19.2249 18.9871 19.0002 22.5248 19.0002 22.5248C19.0002 22.5248 18.7754 18.9871 15.2377 18.7623C18.7754 18.5376 19.0002 14.9999 19.0002 14.9999Z"/>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-semibold">I am RedDemonAI. How can I help you?</h2>
                    </div>
                `;
                return;
            }

            chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
            setTimeout(scrollToBottom, 50);
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if(!confirm('Delete this chat?')) return;
            
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) createNewChat(false);
            if (currentChatId === id) currentChatId = chats[0].id;
            
            saveState();
            renderSidebar();
            loadChat(currentChatId);
        }

        function renameChat(id, e) {
            e.stopPropagation();
            const chat = chats.find(c => c.id === id);
            const newTitle = prompt('Rename chat:', chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();
                saveState();
                renderSidebar();
                if(currentChatId === id) els.mobileHeaderTitle.textContent = chat.title;
            }
        }

        function renderSidebar() {
            els.chatList.innerHTML = chats.map(chat => `
                <div onclick="loadChat('${chat.id}')" class="group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-colors ${chat.id === currentChatId ? 'bg-white dark:bg-[#282a2c] shadow-sm' : 'hover:bg-gray-200 dark:hover:bg-[#282a2c]'}">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span class="truncate text-sm font-medium ${chat.id === currentChatId ? 'text-red-600 dark:text-red-500' : 'text-gray-700 dark:text-gray-300'}">${chat.title}</span>
                    </div>
                    <div class="hidden group-hover:flex items-center space-x-1 flex-shrink-0">
                        <button onclick="renameChat('${chat.id}', event)" class="p-1 rounded hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="deleteChat('${chat.id}', event)" class="p-1 rounded hover:bg-red-200 dark:hover:bg-red-900/30 text-gray-500 hover:text-red-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                </div>
            `).join('');
        }

        // --- Messaging Logic ---
        function appendMessageUI(role, content) {
            const welcomeNode = document.getElementById('welcome-message');
            if (welcomeNode) welcomeNode.remove();

            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col w-full ${role === 'user' ? 'items-end' : 'items-start'}`;

            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="px-5 py-3 rounded-3xl rounded-br-sm bg-gemini-userBubble dark:bg-gemini-darkUserBubble text-gray-900 dark:text-gray-100 max-w-[85%] break-words">
                        ${content.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>")}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="flex space-x-4 max-w-full w-full group">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-red-900 flex-shrink-0 flex items-center justify-center mt-1 shadow-sm">
                            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12.0003 1.99997C12.0003 1.99997 12.4497 9.0754 19.5251 9.52485C12.4497 9.9743 12.0003 17.0498 12.0003 17.0498C12.0003 17.0498 11.5508 9.9743 4.4754 9.52485C11.5508 9.0754 12.0003 1.99997 12.0003 1.99997Z"/>
                                <path d="M19.0002 14.9999C19.0002 14.9999 19.2249 18.5376 22.7626 18.7623C19.2249 18.9871 19.0002 22.5248 19.0002 22.5248C19.0002 22.5248 18.7754 18.9871 15.2377 18.7623C18.7754 18.5376 19.0002 14.9999 19.0002 14.9999Z"/>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0 prose prose-sm md:prose-base dark:prose-invert max-w-none ai-content overflow-x-auto break-words leading-relaxed">
                            ${marked.parse(content)}
                        </div>
                    </div>
                `;
            }
            
            els.messagesContainer.appendChild(wrapper);
            return wrapper;
        }

        els.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isGenerating) return;

            // Check if key was added
            if (AI_CONFIG.apiKey === 'YOUR_API_KEY_HERE' || !AI_CONFIG.apiKey) {
                alert('DEVELOPER ERROR: Please add your OpenRouter API Key in the HTML file code (Line 186) to make RedDemonAI work.');
                return;
            }

            const content = els.messageInput.value.trim();
            if (!content) return;

            els.messageInput.value = '';
            els.messageInput.style.height = 'auto';
            
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            if (chat.messages.length === 0) {
                chat.title = content.length > 25 ? content.substring(0, 25) + '...' : content;
                renderSidebar();
                els.mobileHeaderTitle.textContent = chat.title;
            }

            chat.messages.push({ role: 'user', content });
            saveState();
            appendMessageUI('user', content);
            scrollToBottom();

            // Inject the hardcoded system prompt
            const payloadMessages = [
                { role: 'system', content: AI_CONFIG.systemPrompt },
                ...chat.messages
            ];

            isGenerating = true;
            els.sendBtn.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            
            const aiMessageWrapper = appendMessageUI('assistant', '');
            const aiContentContainer = aiMessageWrapper.querySelector('.ai-content');
            let aiFullText = "";

            try {
                abortController = new AbortController();
                const cleanApiKey = AI_CONFIG.apiKey.trim();
                
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${cleanApiKey}`,
                        'HTTP-Referer': window.location.href, 
                        'X-Title': 'RedDemonAI'
                    },
                    body: JSON.stringify({
                        model: AI_CONFIG.model,
                        messages: payloadMessages,
                        stream: true
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    const errData = await response.json().catch(()=>({}));
                    throw new Error(errData.error?.message || `API Error: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let done = false;
                let buffer = "";

                while (!done) {
                    const { value, done: doneReading } = await reader.read();
                    done = doneReading;
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); 

                        for (const line of lines) {
                            if (line.trim().startsWith('data: ')) {
                                const dataStr = line.replace(/^data:\s*/, '').trim();
                                if (dataStr === '[DONE]') continue;
                                
                                try {
                                    const parsed = JSON.parse(dataStr);
                                    const chunkContent = parsed.choices?.[0]?.delta?.content || "";
                                    if (chunkContent) {
                                        aiFullText += chunkContent;
                                        aiContentContainer.innerHTML = marked.parse(aiFullText);
                                        scrollToBottom();
                                    }
                                } catch (err) {
                                }
                            }
                        }
                    }
                }

                chat.messages.push({ role: 'assistant', content: aiFullText });
                saveState();

            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error(error);
                    const errorMsg = `**Error:** ${error.message}`;
                    aiContentContainer.innerHTML = marked.parse(errorMsg);
                    chat.messages.push({ role: 'assistant', content: errorMsg });
                    saveState();
                }
            } finally {
                isGenerating = false;
                abortController = null;
                els.sendBtn.innerHTML = `<svg class="w-6 h-6 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>`;
            }
        });
    </script>
</body>
</html>
