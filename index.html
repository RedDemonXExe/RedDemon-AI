<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Auto-resizing textarea hide scrollbar until max height */
        textarea::-webkit-scrollbar { display: none; }
        
        /* Hide outline on focus */
        *:focus { outline: none; }
    </style>
</head>
<body class="min-h-screen flex text-gray-900 bg-[#ffffff] dark:bg-[#131314] dark:text-gray-100 font-sans transition-colors duration-200 m-0">

    <div id="loading" class="fixed inset-0 z-[999] bg-white dark:bg-[#131314] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-10 h-10 border-4 border-gray-200 border-t-blue-600 rounded-full animate-spin"></div>
        <p class="mt-4 text-gray-600 dark:text-gray-300 font-medium">Loading App...</p>
    </div>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed md:sticky top-0 h-screen w-[280px] flex-shrink-0 bg-[#f8f9fa] dark:bg-[#1e1f20] border-r border-[#e5e7eb] dark:border-[#374151] z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col">
        <div class="p-4 flex items-center justify-between">
            <button onclick="createNewChat()" class="flex-1 bg-white dark:bg-[#2b2c2f] hover:bg-gray-50 dark:hover:bg-gray-700 text-sm font-medium border border-gray-200 dark:border-gray-700 rounded-full px-4 py-2.5 flex items-center gap-2 shadow-sm transition-colors">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                New Chat
            </button>
            <button onclick="toggleSidebar()" class="md:hidden ml-3 p-2 text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-2">Recent</div>
        
        <div id="chat-list" class="flex-1 overflow-y-auto px-2 space-y-1">
            </div>

        <div class="p-4 border-t border-[#e5e7eb] dark:border-[#374151]">
            <button onclick="toggleSettings()" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Settings
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-30 bg-[#ffffff]/90 dark:bg-[#131314]/90 backdrop-blur-md px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-xl font-medium tracking-tight text-gray-800 dark:text-gray-100">Universal AI</h1>
            </div>
            <button onclick="toggleTheme()" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors" title="Toggle Dark Mode">
                <svg id="theme-icon-dark" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="theme-icon-light" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </header>

        <main id="messages-container" class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-6 flex flex-col gap-6 pb-10">
            </main>

        <div class="sticky bottom-0 w-full bg-gradient-to-t from-[#ffffff] via-[#ffffff] to-transparent dark:from-[#131314] dark:via-[#131314] pt-8 pb-6 px-4 z-30">
            <div class="max-w-3xl mx-auto relative bg-[#f0f4f9] dark:bg-[#2b2c2f] rounded-3xl border border-transparent dark:border-gray-700 shadow-sm focus-within:ring-1 focus-within:ring-gray-300 dark:focus-within:ring-gray-600 transition-shadow">
                <textarea id="chat-input" rows="1" placeholder="Ask Universal AI..." class="w-full bg-transparent border-0 resize-none pl-6 pr-14 py-4 text-gray-900 dark:text-gray-100 max-h-[200px] overflow-y-auto m-0"></textarea>
                <button id="send-btn" onclick="handleSend()" class="absolute right-3 bottom-2.5 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-40 disabled:hover:bg-transparent transition-colors">
                    <svg class="w-6 h-6 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                </button>
            </div>
            <div class="text-center text-xs text-gray-500 mt-3 font-medium">AI can make mistakes. Verify important information.</div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-[#1e1f20] rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="toggleSettings()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 dark:hover:text-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-2xl font-semibold mb-6">Settings</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" class="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="sk-or-v1-...">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model Name</label>
                    <input type="text" id="model-input" class="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="deepseek/deepseek-r1:free">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt</label>
                    <textarea id="system-prompt-input" rows="3" class="w-full bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="You are a helpful AI assistant."></textarea>
                </div>
                <button onclick="saveSettings()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg py-2.5 transition-colors">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: 'none',
                                color: 'inherit',
                                a: { color: '#3b82f6', '&:hover': { color: '#2563eb' } },
                                pre: { backgroundColor: '#1e1f20', color: '#e5e7eb', overflowX: 'auto', padding: '1rem', borderRadius: '0.75rem' },
                                code: { color: '#f43f5e', backgroundColor: 'rgba(150,150,150,0.1)', padding: '0.2rem 0.4rem', borderRadius: '0.25rem', fontWeight: '500' },
                                'code::before': { content: '""' },
                                'code::after': { content: '""' }
                            }
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // Configuration
        const DEFAULT_MODEL = 'deepseek/deepseek-r1:free';
        const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';

        // State Management
        let appState = {
            apiKey: '',
            model: DEFAULT_MODEL,
            systemPrompt: 'You are a helpful, smart, and concise AI assistant.',
            chats: [],
            activeChatId: null,
            darkMode: false
        };

        // Initialize App
        function init() {
            // FIX: marked.setOptions was deprecated and removed. marked.use is the correct modern syntax.
            if (window.marked && marked.use) {
                marked.use({ breaks: true, gfm: true });
            }

            loadState();
            applyTheme();

            if (!Array.isArray(appState.chats)) appState.chats = [];
            
            if (appState.chats.length === 0) {
                createNewChat(false);
            } else if (!appState.activeChatId && appState.chats.length > 0) {
                appState.activeChatId = appState.chats[0].id;
            }

            renderSidebarChats();
            renderMessages();

            // Setup Textarea auto-resize & Enter to send
            const textarea = document.getElementById('chat-input');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
                
                // Toggle send button state
                const sendBtn = document.getElementById('send-btn');
                if(this.value.trim().length > 0) {
                    sendBtn.classList.add('text-blue-600');
                    sendBtn.classList.remove('text-gray-500');
                } else {
                    sendBtn.classList.remove('text-blue-600');
                    sendBtn.classList.add('text-gray-500');
                }
            });

            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            // Hide Loader
            const loader = document.getElementById('loading');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        // Persistence
        function saveState() {
            try {
                localStorage.setItem('universal_ai_state', JSON.stringify(appState));
            } catch (e) {
                console.error("Local storage error:", e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('universal_ai_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.error("Local storage error:", e);
            }
        }

        // Theme Handling
        function toggleTheme() {
            appState.darkMode = !appState.darkMode;
            saveState();
            applyTheme();
        }

        function applyTheme() {
            const html = document.documentElement;
            const darkIcon = document.getElementById('theme-icon-dark');
            const lightIcon = document.getElementById('theme-icon-light');
            
            if (appState.darkMode) {
                html.classList.add('dark');
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            } else {
                html.classList.remove('dark');
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            }
        }

        // Sidebar Handling
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');
            
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Settings Handling
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            const isHidden = modal.classList.contains('hidden');
            
            if (isHidden) {
                document.getElementById('api-key-input').value = appState.apiKey || '';
                document.getElementById('model-input').value = appState.model || DEFAULT_MODEL;
                document.getElementById('system-prompt-input').value = appState.systemPrompt || '';
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function saveSettings() {
            appState.apiKey = document.getElementById('api-key-input').value.trim();
            appState.model = document.getElementById('model-input').value.trim() || DEFAULT_MODEL;
            appState.systemPrompt = document.getElementById('system-prompt-input').value.trim();
            saveState();
            toggleSettings();
        }

        // Chat Management
        function createNewChat(shouldRender = true) {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Chat',
                messages: []
            };
            appState.chats.unshift(newChat);
            appState.activeChatId = newChat.id;
            saveState();
            
            if (shouldRender) {
                renderSidebarChats();
                renderMessages();
                if (window.innerWidth < 768) toggleSidebar();
            }
        }

        function selectChat(id) {
            appState.activeChatId = id;
            saveState();
            renderSidebarChats();
            renderMessages();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if (!confirm('Are you sure you want to delete this chat?')) return;
            
            appState.chats = appState.chats.filter(c => c.id !== id);
            if (appState.activeChatId === id) {
                appState.activeChatId = appState.chats.length > 0 ? appState.chats[0].id : null;
            }
            if (appState.chats.length === 0) createNewChat(false);
            
            saveState();
            renderSidebarChats();
            renderMessages();
        }

        function renameChat(id, e) {
            e.stopPropagation();
            const chat = appState.chats.find(c => c.id === id);
            if (!chat) return;
            
            const newTitle = prompt('Rename Chat:', chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();
                saveState();
                renderSidebarChats();
            }
        }

        // Rendering logic
        function renderSidebarChats() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            
            appState.chats.forEach(chat => {
                const isActive = chat.id === appState.activeChatId;
                
                const btn = document.createElement('div');
                btn.className = `group flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer transition-colors ${isActive ? 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`;
                btn.onclick = () => selectChat(chat.id);
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'truncate text-sm font-medium';
                titleSpan.textContent = chat.title;
                
                const actionsDiv = document.createElement('div');
                actionsDiv.className = `flex items-center gap-1 ${isActive ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} transition-opacity`;
                
                // Edit Btn
                const editBtn = document.createElement('button');
                editBtn.className = 'p-1 hover:text-blue-500 transition-colors';
                editBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>';
                editBtn.onclick = (e) => renameChat(chat.id, e);
                
                // Delete Btn
                const delBtn = document.createElement('button');
                delBtn.className = 'p-1 hover:text-red-500 transition-colors';
                delBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v
